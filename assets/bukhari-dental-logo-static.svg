<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Dr. Syed Hashim Jamshed Bukhari Dental Clinic</title>
  <desc id="logo-desc">A polished three-dimensional tooth, warm gold on the left and clean white on the right, encircled by a travelling aqua whitening ring.</desc>

  <defs>
    <path id="tooth-shape" d="M256 94C294 70 340 72 370 96C404 122 414 164 402 206C394 236 380 254 374 282C367 316 374 358 365 404C357 446 338 470 314 467C296 465 288 438 280 402C274 374 268 356 256 340C244 356 238 374 232 402C224 438 216 465 198 467C174 470 155 446 147 404C138 358 145 316 138 282C132 254 118 236 110 206C98 164 108 122 142 96C172 72 218 70 256 94Z"/>

    <clipPath id="tooth-clip">
      <use href="#tooth-shape"/>
    </clipPath>
    <clipPath id="left-clip">
      <rect x="0" y="0" width="256" height="512"/>
    </clipPath>
    <clipPath id="right-clip">
      <rect x="256" y="0" width="256" height="512"/>
    </clipPath>

    <linearGradient id="left-enamel" x1="112" y1="104" x2="250" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF5D3"/>
      <stop offset="0.34" stop-color="#F5D98F"/>
      <stop offset="0.7" stop-color="#E4B65B"/>
      <stop offset="1" stop-color="#C98932"/>
    </linearGradient>

    <linearGradient id="right-enamel" x1="284" y1="98" x2="396" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.34" stop-color="#F8FCFD"/>
      <stop offset="0.7" stop-color="#E6F0F2"/>
      <stop offset="1" stop-color="#C7DBE0"/>
    </linearGradient>

    <radialGradient id="left-crown-light" cx="0.34" cy="0.23" r="0.72">
      <stop offset="0" stop-color="#FFFDF2" stop-opacity="0.76"/>
      <stop offset="0.5" stop-color="#FFF6DA" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#FFF6DA" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="left-stain" x1="156" y1="292" x2="202" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A6651D" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#A6651D" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#7E4811" stop-opacity="0.24"/>
    </linearGradient>

    <linearGradient id="left-root-shade" x1="150" y1="248" x2="250" y2="462" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8F5A18" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#8F5A18" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#6D3D0B" stop-opacity="0.2"/>
    </linearGradient>

    <radialGradient id="right-crown-light" cx="0.66" cy="0.22" r="0.74">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.46" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="right-root-shade" x1="282" y1="246" x2="360" y2="458" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5D858B" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#5D858B" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#4A7076" stop-opacity="0.24"/>
    </linearGradient>

    <linearGradient id="bottom-shade" x1="256" y1="332" x2="256" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#073D39" stop-opacity="0"/>
      <stop offset="1" stop-color="#073D39" stop-opacity="0.22"/>
    </linearGradient>

    <linearGradient id="seam-glow" x1="256" y1="92" x2="256" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF4C9"/>
      <stop offset="0.35" stop-color="#FFFFFF"/>
      <stop offset="0.72" stop-color="#E7FFFB"/>
      <stop offset="1" stop-color="#BFF8EE"/>
    </linearGradient>

    <linearGradient id="seam-shadow" x1="248" y1="100" x2="264" y2="456" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#79470E" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#5D3A10" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#6B4314" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="rim" x1="104" y1="92" x2="410" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A3D37" stop-opacity="0.44"/>
      <stop offset="0.45" stop-color="#7B531C" stop-opacity="0.28"/>
      <stop offset="0.72" stop-color="#0B4F4A" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.46"/>
    </linearGradient>

    <linearGradient id="edge-light" x1="100" y1="0" x2="412" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.58" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.88" stop-color="#FFFFFF" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="ring-gradient" x1="32" y1="36" x2="482" y2="490" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08756F"/>
      <stop offset="0.3" stop-color="#1CA99E"/>
      <stop offset="0.62" stop-color="#66EBDD"/>
      <stop offset="0.86" stop-color="#EAFFFB"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>

    <linearGradient id="ring-guide" x1="32" y1="36" x2="482" y2="490" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D7C76" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#36C9BC" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#D8FFF9" stop-opacity="0.28"/>
    </linearGradient>

    <radialGradient id="ring-bead-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#9CFFF2" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#42D9CA" stop-opacity="0"/>
    </radialGradient>

    <filter id="tooth-shadow" x="-18%" y="-14%" width="136%" height="136%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#042A26" flood-opacity="0.22"/>
    </filter>

    <filter id="ring-glow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="ring-halo" x="-32%" y="-32%" width="164%" height="164%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7"/>
    </filter>

    <filter id="seam-soft" x="-30%" y="-10%" width="160%" height="120%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <!-- The whitening ring sits behind the tooth so the enamel edge stays crisp. -->
  <g aria-hidden="true">
    <circle cx="256" cy="262" r="226" fill="none" stroke="url(#ring-guide)" stroke-width="2.8"/>
    <g class="ring-orbit" transform="rotate(-90 256 262)">
      <circle cx="256" cy="262" r="226" fill="none" stroke="#36DCCE" stroke-width="15" stroke-linecap="round" stroke-dasharray="172 188" pathLength="360" opacity="0.16" filter="url(#ring-halo)"/>
      <circle cx="256" cy="262" r="226" fill="none" stroke="#0B6A65" stroke-width="9.5" stroke-linecap="round" stroke-dasharray="118 242" pathLength="360" opacity="0.28"/>
      <circle cx="256" cy="262" r="226" fill="none" stroke="url(#ring-gradient)" stroke-width="7.5" stroke-linecap="round" stroke-dasharray="118 242" pathLength="360" filter="url(#ring-glow)"/>
      <circle cx="482" cy="262" r="18" fill="url(#ring-bead-glow)"/>
      <circle cx="482" cy="262" r="5.4" fill="#FFFFFF"/>
      <path d="M482 245 L486 258 L499 262 L486 266 L482 279 L478 266 L465 262 L478 258 Z" fill="#FFFFFF" opacity="0.95"/>
    </g>
  </g>

  <!-- Tooth body -->
  <g filter="url(#tooth-shadow)">
    <g clip-path="url(#tooth-clip)">
      <g clip-path="url(#left-clip)">
        <use href="#tooth-shape" fill="url(#left-enamel)"/>
        <ellipse cx="178" cy="170" rx="84" ry="108" fill="url(#left-crown-light)"/>
        <path d="M150 288C166 322 184 376 198 448C186 452 174 442 168 414C157 370 148 330 150 288Z" fill="url(#left-stain)"/>
        <path d="M150 248C166 300 184 386 196 458L256 458L256 250Z" fill="url(#left-root-shade)"/>
      </g>

      <g clip-path="url(#right-clip)">
        <use href="#tooth-shape" fill="url(#right-enamel)"/>
        <ellipse cx="334" cy="172" rx="92" ry="116" fill="url(#right-crown-light)"/>
        <path d="M282 254C304 298 322 370 326 458L256 458L256 250Z" fill="url(#right-root-shade)"/>
      </g>

      <rect x="64" y="64" width="384" height="416" fill="url(#bottom-shade)"/>

      <!-- The left half is washed clean as the ring passes the seam. -->
      <g clip-path="url(#left-clip)">
      </g>

      <!-- Refined enamel highlights keep the mark three-dimensional in both states. -->
      <path d="M146 154C180 112 225 108 244 150C224 140 198 146 172 184C160 174 150 164 146 154Z" fill="#FFFFFF" opacity="0.32"/>
      <path d="M294 118C348 128 380 180 370 250C356 214 334 180 290 158C288 144 290 128 294 118Z" fill="#FFFFFF" opacity="0.42"/>
      <path d="M304 270C324 292 334 330 328 370C322 408 310 438 302 454C292 408 294 324 304 270Z" fill="#FFFFFF" opacity="0.18"/>
      <ellipse cx="338" cy="136" rx="27" ry="15" transform="rotate(22 338 136)" fill="#FFFFFF" opacity="0.7"/>
      <ellipse cx="196" cy="148" rx="16" ry="9" transform="rotate(-24 196 148)" fill="#FFFFFF" opacity="0.44"/>

      <!-- A subtle lit edge on the clean side, plus a travel highlight for the wipe. -->
      <use href="#tooth-shape" fill="none" stroke="url(#edge-light)" stroke-width="7" opacity="0.62"/>
      <g clip-path="url(#tooth-clip)">
      </g>
    </g>

    <!-- The seam is the one crisp division: warm enamel meets clean enamel. -->
    <g clip-path="url(#tooth-clip)">
      <path d="M256 94C248 150 262 196 256 254C250 312 264 382 256 458" fill="none" stroke="url(#seam-shadow)" stroke-width="8" opacity="0.55" filter="url(#seam-soft)"/>
      <path d="M256 94C248 150 262 196 256 254C250 312 264 382 256 458" fill="none" stroke="url(#seam-glow)" stroke-width="2.8" opacity="0.92" filter="url(#seam-soft)"/>
      <path d="M256 94C248 150 262 196 256 254C250 312 264 382 256 458" fill="none" stroke="#FFFFFF" stroke-width="1.1" opacity="0.72"/>
    </g>

    <use href="#tooth-shape" fill="none" stroke="url(#rim)" stroke-width="3.4"/>
  </g>
</svg>

